name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "1"
  WRANGLER_SEND_METRICS: "false"
  ASTRO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  code:
    name: Code (rich)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.x"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Validate code
        run: node scripts/quality.mjs code
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-results
          path: |
            ${{ runner.temp }}/starter-kit-browser-results
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.x"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: Validate security
        run: node scripts/quality.mjs security

  quality:
    name: Quality Gates
    if: always() && github.event_name != 'schedule'
    needs: [code, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation stage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const results = JSON.parse(process.env.RESULTS);
          for (const [name, job] of Object.entries(results)) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- ${name}: ${job.result}\n`);
          }
          if (Object.values(results).some(job => job.result !== 'success')) process.exit(1);
          JS

  publish:
    name: Publish to npm
    needs: quality
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify npm supports trusted publishing
        run: |
          node --input-type=module -e 'import { execFileSync } from "node:child_process"; const [major, minor, patch] = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("Trusted publishing requires npm >=11.5.1");'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish if version changed
        shell: bash
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          # Registry/auth/network failures must fail the job, rather than look
          # like an unpublished version or a successful release.
          npm view "$package_name" versions --json > "$RUNNER_TEMP/npm-versions.json"
          if node --input-type=module -e 'import { readFileSync } from "node:fs"; const versions = JSON.parse(readFileSync(process.argv[1], "utf8")); process.exit([versions].flat().includes(process.argv[2]) ? 0 : 1);' "$RUNNER_TEMP/npm-versions.json" "$package_version"; then
            echo "$package_name@$package_version already exists; skipping publication."
            exit 0
          fi
          npm publish --access public
